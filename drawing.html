<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drawing Area</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
            background-color: #fff0f5;
        }
        svg{
            border: 2px solid #ff69b4;
            background-color: #ffe6f0;
        }
        .button-container{
            margin-top: 10px;
            text-align: center;
        }
        button{
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background-color: #ff69b4;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<svg id="drawingArea" width="800" height="400"></svg>
<div class="button-container">
    <button id="clearButton" title="Clear canvas">🗑</button>
</div>
<script src="drawing.js"></script>
</body>
</html>
